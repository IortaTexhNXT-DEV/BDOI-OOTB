# BrokerVerse: PostgreSQL + API + web. `docker compose up --build`, then open http://localhost:8080
# Sign in as BrokerVerse / the ADMIN_PASSWORD below, then create persona users under Master > User Management.
# Required: JWT_SECRET, DATA_ENCRYPTION_KEY, ADMIN_PASSWORD, CORS_ORIGINS, PUBLIC_BASE_URL (see deploy/REFERENCE.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brokerverse
      POSTGRES_USER: brokerverse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brokerverse}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerverse -d brokerverse"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      PORT: 8000
      # production by default: the API refuses to start without the four variables below (deploy/REFERENCE.md)
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://brokerverse:${DB_PASSWORD:-brokerverse}@db:5432/brokerverse
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 characters}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY to a different random string of at least 32 characters}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to the first administrator password}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the public web address, e.g. https://brokerverse.example.ph}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the public address, e.g. https://brokerverse.example.ph}
      SMTP_URL: ${SMTP_URL:-}
      UPLOAD_DIR: /app/uploads
      # reference data only in production; SEED_SAMPLE_DATA=true adds the demo leads, policies, claims... (UAT / demos)
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      # scheduled jobs (one run per job across instances: PostgreSQL advisory lock); false on instances that must not run them
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    # one image for every environment: /env-config.js and the /api proxy are written when the container starts
    build: ./brokerverse
    environment:
      API_UPSTREAM: http://api:8000
      # label next to the logo (DEV, SIT, UAT, PREPROD...); empty or PRODUCTION shows none
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-}
      ENVIRONMENT_COLOR: ${ENVIRONMENT_COLOR:-}
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  db-data:
  uploads:
