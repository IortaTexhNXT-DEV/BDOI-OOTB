  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    # needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # - name: Download coverage reports
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: coverage-reports
      #     path: coverage/

      # - name: SonarQube Analysis
      #   uses: SonarSource/sonarqube-scan-action@v5
      #   env:
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Relax TypeScript rules for CI
        run: |
          echo "Relaxing TypeScript compiler checks (noUnusedLocals/Parameters)..."
          sed -i 's/"noUnusedLocals": true/"noUnusedLocals": false/g' tsconfig.json || true
          sed -i 's/"noUnusedParameters": true/"noUnusedParameters": false/g' tsconfig.json || true

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          # Prevent warnings (ESLint, autoprefixer) from failing the build
          CI: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1 # Update to your region

      - name: Deploy to S3
        run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
