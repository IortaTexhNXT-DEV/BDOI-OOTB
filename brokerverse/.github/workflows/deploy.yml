name: Build and deploy

# Builds the BrokerVerse front end and publishes it to the S3 bucket behind the CloudFront distribution of the
# existing BrokerVerse URL. Runs on every push to dev.
#
# Repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
# Repository variable: REACT_APP_BASE_URL (the API address, e.g. https://<brokerverse-url>/api)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  NODE_VERSION: "22"
  AWS_REGION: ap-southeast-1

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npx craco test --watchAll=false
        env:
          CI: true

      - name: Check the API address is set
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ vars.REACT_APP_BASE_URL }}" ]; then
            echo "The repository variable REACT_APP_BASE_URL is not set; the app would have no API address." >&2
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}

      - name: Keep the build for the deploy job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/
          retention-days: 1

  deploy:
    name: Publish to S3 and refresh CloudFront
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
