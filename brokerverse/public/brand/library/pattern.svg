<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" preserveAspectRatio="xMidYMid slice">
  <!-- BrokerVerse sign-in library: neutral pattern (concentric rings and a dot grid), drawn in white. -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="960" height="900" fill="url(#dots)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="760" cy="180" r="120" stroke-opacity="0.18"/>
    <circle cx="760" cy="180" r="200" stroke-opacity="0.12"/>
    <circle cx="760" cy="180" r="290" stroke-opacity="0.08"/>
    <circle cx="160" cy="780" r="140" stroke-opacity="0.16"/>
    <circle cx="160" cy="780" r="240" stroke-opacity="0.10"/>
  </g>
  <g fill="#ffffff">
    <rect x="120" y="180" width="300" height="10" rx="5" fill-opacity="0.18"/>
    <rect x="120" y="210" width="220" height="10" rx="5" fill-opacity="0.12"/>
    <rect x="120" y="240" width="260" height="10" rx="5" fill-opacity="0.08"/>
  </g>
</svg>
