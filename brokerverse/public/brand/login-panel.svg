<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A4A"/>
      <stop offset="0.55" stop-color="#0F4761"/>
      <stop offset="1" stop-color="#0072D8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0072D8" stop-opacity="0"/>
      <stop offset="1" stop-color="#0072D8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="900" fill="url(#bg)"/>
  <rect width="960" height="900" fill="url(#grid)"/>

  <!-- protection shield -->
  <g transform="translate(480 330)">
    <circle r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="4 10"/>
    <path d="M0 -112 L92 -78 V-8 C92 58 50 104 0 124 C-50 104 -92 58 -92 -8 V-78 Z" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-38 4 L-10 32 L44 -26" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lines of business around the shield: motor, property, marine, accident, health -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- motor -->
    <g transform="translate(250 190)">
      <circle r="46" fill="#FFFFFF" fill-opacity="0.08" stroke-opacity="0.35"/>
      <path d="M-26 8 V-2 L-18 -16 H18 L26 -2 V8 Z"/><circle cx="-14" cy="10" r="5"/><circle cx="14" cy="10" r="5"/><path d="M-12 -4 H12"/>
    </g>
    <!-- property -->
    <g transform="translate(710 190)">
      <circle r="46" fill="#FFFFFF" fill-opacity="0.08" stroke-opacity="0.35"/>
      <path d="M-24 2 L0 -20 L24 2"/><path d="M-17 -4 V20 H17 V-4"/><path d="M-5 20 V6 H5 V20"/>
    </g>
    <!-- marine -->
    <g transform="translate(200 420)">
      <circle r="46" fill="#FFFFFF" fill-opacity="0.08" stroke-opacity="0.35"/>
      <path d="M-26 6 H26 L18 18 H-18 Z"/><path d="M-10 6 V-18 L10 -6 H-10"/><path d="M-26 24 Q-19 20 -12 24 T2 24 T16 24 T28 24"/>
    </g>
    <!-- accident -->
    <g transform="translate(760 420)">
      <circle r="46" fill="#FFFFFF" fill-opacity="0.08" stroke-opacity="0.35"/>
      <circle cx="0" cy="-14" r="7"/><path d="M-16 20 C-16 2 16 2 16 20"/><path d="M-22 -2 L22 -2" stroke-opacity="0.6"/>
    </g>
    <!-- health -->
    <g transform="translate(480 610)">
      <circle r="46" fill="#FFFFFF" fill-opacity="0.08" stroke-opacity="0.35"/>
      <path d="M0 18 C-26 2 -24 -20 -8 -20 C-3 -20 0 -16 0 -12 C0 -16 3 -20 8 -20 C24 -20 26 2 0 18 Z"/><path d="M-6 -4 H6 M0 -10 V2"/>
    </g>
  </g>

  <!-- city skyline -->
  <g fill="#FFFFFF" fill-opacity="0.13">
    <rect x="0" y="780" width="960" height="120"/>
    <rect x="30" y="700" width="46" height="90"/><rect x="84" y="660" width="38" height="130"/><rect x="130" y="720" width="56" height="70"/>
    <rect x="196" y="640" width="34" height="150"/><path d="M196 640 L213 610 L230 640 Z"/><rect x="238" y="690" width="60" height="100"/>
    <rect x="310" y="610" width="44" height="180"/><rect x="362" y="670" width="40" height="120"/><rect x="410" y="720" width="70" height="70"/>
    <rect x="560" y="680" width="48" height="110"/><rect x="616" y="620" width="36" height="170"/><rect x="660" y="700" width="62" height="90"/>
    <rect x="730" y="650" width="40" height="140"/><rect x="778" y="710" width="54" height="80"/><rect x="840" y="670" width="40" height="120"/><rect x="888" y="730" width="72" height="60"/>
  </g>
  <rect x="0" y="560" width="960" height="340" fill="url(#sky)"/>

  <!-- jeepney: long body, open rear, front hood and grille, roof rack, side stripe -->
  <g transform="translate(480 742)" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-86 24 V-14 Q-86 -24 -76 -24 H58 V2 L94 6 Q100 7 100 14 V24 Z"/>
    <path d="M-80 -24 V-32 H54 V-24 M-64 -32 V-36 M-24 -32 V-36 M16 -32 V-36"/>
    <path d="M-74 -16 H-52 V0 H-74 Z M-44 -16 H-22 V0 H-44 Z M-14 -16 H8 V0 H-14 Z M16 -16 H38 V0 H16 Z"/>
    <path d="M44 -16 H56 V0 H44"/>
    <path d="M88 10 V20 M93 10 V20" stroke-opacity="0.6"/>
    <path d="M-86 8 H58" stroke-opacity="0.55"/>
    <circle cx="-56" cy="26" r="9"/><circle cx="66" cy="26" r="9"/>
    <path d="M-98 26 H-66 M-46 26 H56 M76 26 H104"/>
  </g>

  <!-- one line, no slogan wall -->
  <text x="480" y="860" text-anchor="middle" font-family="Nunito, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="0.5">Insurance broking for the Philippines</text>
</svg>
