<line x1="255.0" y1="441" x2="703.0" y2="441" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="330.0" y="466" font-size="11" text-anchor="middle" fill="#1F2937">approve / return / reject</text>
<text x="330.0" y="480" font-size="11" text-anchor="middle" fill="#1F2937">(maker cannot approve)</text>
<line x1="405.0" y1="489" x2="257.0" y2="489" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="514" font-size="11" text-anchor="middle" fill="#1F2937">settled through the broker: posting rule claim.settlement.paid_through_broker, Dr</text>
<text x="480.0" y="528" font-size="11" text-anchor="middle" fill="#1F2937">recoverable from each insurer by share / Cr payable to claimant</text>
<line x1="255.0" y1="537" x2="703.0" y2="537" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="562" font-size="11" text-anchor="middle" fill="#1F2937">record funds received from each insurer</text>
<text x="405.0" y="576" font-size="11" text-anchor="middle" fill="#1F2937">(claim.funds_received) and the payment to the claimant</text>
<text x="405.0" y="590" font-size="11" text-anchor="middle" fill="#1F2937">(claim.paid_to_claimant)</text>
<line x1="555.0" y1="599" x2="257.0" y2="599" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="624" font-size="11" text-anchor="middle" fill="#1F2937">claim_settlement_movements; neither side may exceed what is due; reinsurance</text>
