<text x="180.0" y="116" font-size="11" text-anchor="middle" fill="#1F2937">register claim (first notice</text>
<text x="180.0" y="130" font-size="11" text-anchor="middle" fill="#1F2937">of loss) with documents</text>
<line x1="105.0" y1="139" x2="253.0" y2="139" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="164" font-size="11" text-anchor="middle" fill="#1F2937">acceptance check: policy active, loss date inside the</text>
<text x="405.0" y="178" font-size="11" text-anchor="middle" fill="#1F2937">policy period; next_number(&#x27;claim&#x27;) -&gt; CLM-</text>
<line x1="255.0" y1="187" x2="553.0" y2="187" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="212" font-size="11" text-anchor="middle" fill="#1F2937">claim registered; claim_history; claim_field_changes;</text>
<text x="405.0" y="226" font-size="11" text-anchor="middle" fill="#1F2937">handler assigned; notifications</text>
<line x1="255.0" y1="235" x2="553.0" y2="235" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="180.0" y="260" font-size="11" text-anchor="middle" fill="#5B6776">acknowledgement / letters</text>
<text x="180.0" y="274" font-size="11" text-anchor="middle" fill="#5B6776">generated as PDF on</text>
<text x="180.0" y="288" font-size="11" text-anchor="middle" fill="#5B6776">request</text>
<line x1="255.0" y1="297" x2="107.0" y2="297" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="180.0" y="322" font-size="11" text-anchor="middle" fill="#1F2937">review (in-review), update</text>
<text x="180.0" y="336" font-size="11" text-anchor="middle" fill="#1F2937">estimate and details</text>
<text x="180.0" y="350" font-size="11" text-anchor="middle" fill="#1F2937">(field-level audit)</text>
<line x1="105.0" y1="359" x2="253.0" y2="359" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="180.0" y="384" font-size="11" text-anchor="middle" fill="#1F2937">settle: amount, type,</text>
<text x="180.0" y="398" font-size="11" text-anchor="middle" fill="#1F2937">document</text>
<line x1="105.0" y1="407" x2="253.0" y2="407" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="432" font-size="11" text-anchor="middle" fill="#1F2937">pending-approval when approval is required (settlement</text>
<text x="405.0" y="446" font-size="11" text-anchor="middle" fill="#1F2937">awaiting a different user)</text>
<line x1="255.0" y1="455" x2="553.0" y2="455" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="330.0" y="480" font-size="11" text-anchor="middle" fill="#1F2937">approve / return / reject</text>
<text x="330.0" y="494" font-size="11" text-anchor="middle" fill="#1F2937">(maker cannot approve)</text>
<line x1="405.0" y1="503" x2="257.0" y2="503" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="528" font-size="11" text-anchor="middle" fill="#1F2937">approved -&gt; settled (settled_amount, settled_at); later</text>
<text x="405.0" y="542" font-size="11" text-anchor="middle" fill="#1F2937">closed</text>
<line x1="255.0" y1="551" x2="553.0" y2="551" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="630.0" y="576" font-size="11" text-anchor="middle" fill="#1F2937">recovery raised against the</text>
<text x="630.0" y="590" font-size="11" text-anchor="middle" fill="#1F2937">cession of the policy</text>
<text x="630.0" y="604" font-size="11" text-anchor="middle" fill="#1F2937">(reinsurance_recoveries)</text>
<line x1="705.0" y1="613" x2="557.0" y2="613" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="35" y="628" width="740" height="27" rx="4" fill="#FFF8E1" stroke="#E0B23A"/>
<text x="48" y="644" font-size="11" text-anchor="start" fill="#1F2937">Agents may register first notice of loss on their own policies only (record scope); review, reject, settle, approve and close need the claims role.</text>
