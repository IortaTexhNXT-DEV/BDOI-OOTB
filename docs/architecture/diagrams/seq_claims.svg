<text x="480.0" y="178" font-size="11" text-anchor="middle" fill="#1F2937">next_document_number(&#x27;claim&#x27;) -&gt; CLM-</text>
<line x1="255.0" y1="187" x2="703.0" y2="187" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="212" font-size="11" text-anchor="middle" fill="#1F2937">claim registered; claim_history; claim_field_changes; handler assigned; notifications</text>
