<text x="180.0" y="274" font-size="11" text-anchor="middle" fill="#5B6776">discharge voucher printed</text>
<text x="180.0" y="288" font-size="11" text-anchor="middle" fill="#5B6776">as PDF on request</text>
<line x1="255.0" y1="297" x2="107.0" y2="297" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
