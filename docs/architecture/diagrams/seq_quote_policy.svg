<text x="480.0" y="178" font-size="11" text-anchor="middle" fill="#1F2937">price with configured tariff and tax rates (VAT, DST, LGT); next_number(&#x27;quote&#x27;) -&gt;</text>
<text x="480.0" y="192" font-size="11" text-anchor="middle" fill="#1F2937">QT-YYYY-nnnnn; audit</text>
<line x1="255.0" y1="201" x2="703.0" y2="201" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
