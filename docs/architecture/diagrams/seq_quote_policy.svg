<text x="180.0" y="116" font-size="11" text-anchor="middle" fill="#1F2937">lead (LD-); broker slip</text>
<text x="180.0" y="130" font-size="11" text-anchor="middle" fill="#1F2937">(BS-) with the risk details,</text>
<text x="180.0" y="144" font-size="11" text-anchor="middle" fill="#1F2937">sent to several insurers</text>
<line x1="105.0" y1="153" x2="253.0" y2="153" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="330.0" y="178" font-size="11" text-anchor="middle" fill="#1F2937">request for quotation</text>
<text x="330.0" y="192" font-size="11" text-anchor="middle" fill="#1F2937">through the e-mail outbox</text>
<text x="330.0" y="206" font-size="11" text-anchor="middle" fill="#1F2937">(template</text>
<text x="330.0" y="220" font-size="11" text-anchor="middle" fill="#1F2937">broker_slip_request)</text>
<line x1="255.0" y1="229" x2="403.0" y2="229" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="330.0" y="254" font-size="11" text-anchor="middle" fill="#5B6776">offers keyed as OFR-</text>
<text x="330.0" y="268" font-size="11" text-anchor="middle" fill="#5B6776">(premium, rate,</text>
<text x="330.0" y="282" font-size="11" text-anchor="middle" fill="#5B6776">deductibles, share offered)</text>
<text x="330.0" y="296" font-size="11" text-anchor="middle" fill="#5B6776">or declines</text>
<line x1="405.0" y1="305" x2="257.0" y2="305" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="180.0" y="330" font-size="11" text-anchor="middle" fill="#1F2937">compare offers; chosen</text>
<text x="180.0" y="344" font-size="11" text-anchor="middle" fill="#1F2937">offers become a quotation</text>
<text x="180.0" y="358" font-size="11" text-anchor="middle" fill="#1F2937">(QT-) or a placement slip</text>
<text x="180.0" y="372" font-size="11" text-anchor="middle" fill="#1F2937">(PS-)</text>
<line x1="105.0" y1="381" x2="253.0" y2="381" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="555.0" y="406" font-size="11" text-anchor="middle" fill="#1F2937">price with the product template and configured tax rates (VAT, DST, LGT); commission from the rate matrix;</text>
<text x="555.0" y="420" font-size="11" text-anchor="middle" fill="#1F2937">next_document_number(&#x27;quote&#x27;); audit</text>
<line x1="255.0" y1="429" x2="853.0" y2="429" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="454" font-size="11" text-anchor="middle" fill="#1F2937">quotation e-mailed with an approval link (valid 168 h);</text>
<text x="405.0" y="468" font-size="11" text-anchor="middle" fill="#1F2937">client accepts on the public page</text>
<line x1="255.0" y1="477" x2="553.0" y2="477" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="180.0" y="502" font-size="11" text-anchor="middle" fill="#1F2937">placement slip sent to the</text>
<text x="180.0" y="516" font-size="11" text-anchor="middle" fill="#1F2937">lead insurer and</text>
<text x="180.0" y="530" font-size="11" text-anchor="middle" fill="#1F2937">co-insurers; each confirms</text>
<text x="180.0" y="544" font-size="11" text-anchor="middle" fill="#1F2937">(binds) with its reference</text>
<line x1="105.0" y1="553" x2="253.0" y2="553" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="35" y="568" width="890" height="42" rx="4" fill="#FFF8E1" stroke="#E0B23A"/>
<text x="48" y="584" font-size="11" text-anchor="start" fill="#1F2937">The steps a product needs are set per product type or line in placement.journey (required, optional or skip). Motor goes straight from quotation to policy; fire, engineering, marine</text>
<text x="48" y="599" font-size="11" text-anchor="start" fill="#1F2937">and casualty require a placement slip. Co-insurance participants (one lead, shares total 100%) are held in risk_participants.</text>
<text x="180.0" y="626" font-size="11" text-anchor="middle" fill="#1F2937">issue policy (KYC check: ID,</text>
<text x="180.0" y="640" font-size="11" text-anchor="middle" fill="#1F2937">vehicle identifiers for</text>
<text x="180.0" y="654" font-size="11" text-anchor="middle" fill="#1F2937">motor)</text>
<line x1="105.0" y1="663" x2="253.0" y2="663" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="688" font-size="11" text-anchor="middle" fill="#1F2937">issuePolicy inside one database transaction (source row locked FOR UPDATE)</text>
<line x1="255.0" y1="697" x2="703.0" y2="697" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="780.0" y="722" font-size="11" text-anchor="middle" fill="#1F2937">policy POL-; participants</text>
<text x="780.0" y="736" font-size="11" text-anchor="middle" fill="#1F2937">copied; receivable INV-</text>
<text x="780.0" y="750" font-size="11" text-anchor="middle" fill="#1F2937">with the insurer due date</text>
<text x="780.0" y="764" font-size="11" text-anchor="middle" fill="#1F2937">from the credit terms</text>
<line x1="705.0" y1="773" x2="853.0" y2="773" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="780.0" y="798" font-size="11" text-anchor="middle" fill="#1F2937">posting rule</text>
<text x="780.0" y="812" font-size="11" text-anchor="middle" fill="#1F2937">policy.issue.broker_billed</text>
<text x="780.0" y="826" font-size="11" text-anchor="middle" fill="#1F2937">builds the journal, Dr</text>
<text x="780.0" y="840" font-size="11" text-anchor="middle" fill="#1F2937">premium receivable / Cr</text>
<text x="780.0" y="854" font-size="11" text-anchor="middle" fill="#1F2937">due to each insurer +</text>
<text x="780.0" y="868" font-size="11" text-anchor="middle" fill="#1F2937">commission income</text>
<line x1="705.0" y1="877" x2="853.0" y2="877" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="780.0" y="902" font-size="11" text-anchor="middle" fill="#1F2937">collection item for the</text>
<text x="780.0" y="916" font-size="11" text-anchor="middle" fill="#1F2937">open bill; commission lines</text>
<text x="780.0" y="930" font-size="11" text-anchor="middle" fill="#1F2937">accrued for the referrer</text>
<text x="780.0" y="944" font-size="11" text-anchor="middle" fill="#1F2937">chain</text>
<line x1="705.0" y1="953" x2="853.0" y2="953" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="978" font-size="11" text-anchor="middle" fill="#5B6776">policy issued; policy schedule and slips printed as PDF with the Company letterhead</text>
<line x1="705.0" y1="987" x2="107.0" y2="987" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
