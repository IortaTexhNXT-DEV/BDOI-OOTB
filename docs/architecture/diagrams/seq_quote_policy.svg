<text x="48" y="768" font-size="11" text-anchor="start" fill="#1F2937">Broker-billed (default) policies follow this path. A direct-billed policy books a commission receivable (direct_bill_items) instead of a premium bill; see the remittance and</text>
<text x="48" y="783" font-size="11" text-anchor="start" fill="#1F2937">direct-bill flow.</text>
