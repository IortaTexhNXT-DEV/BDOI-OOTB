<line x1="105.0" y1="235" x2="253.0" y2="235" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="260" font-size="11" text-anchor="middle" fill="#1F2937">status sent; approval token hash; email_outbox row; notification to underwriting</text>
<line x1="255.0" y1="269" x2="703.0" y2="269" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="630.0" y="294" font-size="11" text-anchor="middle" fill="#1F2937">every 5 min: send queued e-mail (SMTP) with approval link (valid 168 h)</text>
<line x1="855.0" y1="303" x2="407.0" y2="303" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="330.0" y="328" font-size="11" text-anchor="middle" fill="#1F2937">open</text>
<text x="330.0" y="342" font-size="11" text-anchor="middle" fill="#1F2937">/approve-quote?token=...</text>
<text x="330.0" y="356" font-size="11" text-anchor="middle" fill="#1F2937">(public, token must be the</text>
<text x="330.0" y="370" font-size="11" text-anchor="middle" fill="#1F2937">latest issued)</text>
<line x1="405.0" y1="379" x2="257.0" y2="379" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="404" font-size="11" text-anchor="middle" fill="#1F2937">status accepted; notify the quotation owner</text>
