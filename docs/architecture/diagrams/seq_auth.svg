<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1082" viewBox="0 0 660 1082" font-family="Nunito, DejaVu Sans, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F2937"/></marker></defs>
<text x="30" y="26" font-size="16" text-anchor="start" fill="#0065B3" font-weight="bold">Sign-in, token refresh and signed file links</text>
<rect x="38.0" y="60" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="105.0" y="79" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">User (browser SPA)</text>
<rect x="38.0" y="1035" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="105.0" y="1054" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">User (browser SPA)</text>
<line x1="105.0" y1="87" x2="105.0" y2="1035" stroke="#9FB3C8" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="188.0" y="60" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="255.0" y="79" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">API: auth module</text>
<rect x="188.0" y="1035" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="255.0" y="1054" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">API: auth module</text>
<line x1="255.0" y1="87" x2="255.0" y2="1035" stroke="#9FB3C8" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="338.0" y="60" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="405.0" y="79" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">API: any module</text>
<rect x="338.0" y="1035" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="405.0" y="1054" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">API: any module</text>
<line x1="405.0" y1="87" x2="405.0" y2="1035" stroke="#9FB3C8" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="488.0" y="60" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="555.0" y="79" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">PostgreSQL</text>
<rect x="488.0" y="1035" width="134" height="27" rx="6" fill="#EAF6FD" stroke="#0065B3"/>
<text x="555.0" y="1054" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">PostgreSQL</text>
<line x1="555.0" y1="87" x2="555.0" y2="1035" stroke="#9FB3C8" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="30" y1="120" x2="630" y2="120" stroke="#00ACF1" stroke-width="1"/>
<rect x="300.74609375" y="109" width="58.5078125" height="22" rx="10" fill="white" stroke="#00ACF1"/>
<text x="330.0" y="124" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">Sign-in</text>
<text x="180.0" y="150" font-size="11" text-anchor="middle" fill="#1F2937">POST /api/auth/login</text>
<text x="180.0" y="164" font-size="11" text-anchor="middle" fill="#1F2937">{username, password}</text>
<text x="180.0" y="178" font-size="11" text-anchor="middle" fill="#1F2937">(rate limit 10 / 5 min per IP</text>
<text x="180.0" y="192" font-size="11" text-anchor="middle" fill="#1F2937">and per username)</text>
<line x1="105.0" y1="201" x2="253.0" y2="201" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="226" font-size="11" text-anchor="middle" fill="#1F2937">load user, roles, permissions; bcrypt compare</text>
<line x1="255.0" y1="235" x2="553.0" y2="235" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="35" y="250" width="590" height="57" rx="4" fill="#FFF8E1" stroke="#E0B23A"/>
<text x="48" y="266" font-size="11" text-anchor="start" fill="#1F2937">Wrong password: failed_logins + 1, account locked at limits.max_login_attempts (5). 2FA users get a 5-minute</text>
<text x="48" y="281" font-size="11" text-anchor="start" fill="#1F2937">challenge token and call POST /auth/login/2fa with the TOTP code. must_change_password or an expired password</text>
<text x="48" y="296" font-size="11" text-anchor="start" fill="#1F2937">yields a restricted token that only reaches change-password.</text>
<text x="405.0" y="323" font-size="11" text-anchor="middle" fill="#1F2937">insert refresh_tokens (jti, family, expiry 30 days);</text>
<text x="405.0" y="337" font-size="11" text-anchor="middle" fill="#1F2937">login_history row</text>
<line x1="255.0" y1="346" x2="553.0" y2="346" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="180.0" y="371" font-size="11" text-anchor="middle" fill="#5B6776">accessToken (HS256, 30</text>
<text x="180.0" y="385" font-size="11" text-anchor="middle" fill="#5B6776">min, sub, roles,</text>
<text x="180.0" y="399" font-size="11" text-anchor="middle" fill="#5B6776">permissions, tv =</text>
<text x="180.0" y="413" font-size="11" text-anchor="middle" fill="#5B6776">token_version) +</text>
<text x="180.0" y="427" font-size="11" text-anchor="middle" fill="#5B6776">refreshToken (jti)</text>
<line x1="255.0" y1="436" x2="107.0" y2="436" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="30" y1="465" x2="630" y2="465" stroke="#00ACF1" stroke-width="1"/>
<rect x="282.79296875" y="454" width="94.4140625" height="22" rx="10" fill="white" stroke="#00ACF1"/>
<text x="330.0" y="469" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">Every API call</text>
<text x="255.0" y="495" font-size="11" text-anchor="middle" fill="#1F2937">Authorization: Bearer access token</text>
<line x1="105.0" y1="504" x2="403.0" y2="504" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="480.0" y="529" font-size="11" text-anchor="middle" fill="#1F2937">users.status = active AND</text>
<text x="480.0" y="543" font-size="11" text-anchor="middle" fill="#1F2937">token_version = tv ?</text>
<line x1="405.0" y1="552" x2="553.0" y2="552" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="255.0" y="577" font-size="11" text-anchor="middle" fill="#5B6776">200 data (file URLs signed ?exp=&amp;sig=, valid</text>
<text x="255.0" y="591" font-size="11" text-anchor="middle" fill="#5B6776">FILE_URL_TTL_SECONDS = 30 min) or 401</text>
<line x1="405.0" y1="600" x2="107.0" y2="600" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="30" y1="629" x2="630" y2="629" stroke="#00ACF1" stroke-width="1"/>
<rect x="263.66796875" y="618" width="132.6640625" height="22" rx="10" fill="white" stroke="#00ACF1"/>
<text x="330.0" y="633" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">Access token expired</text>
<text x="180.0" y="659" font-size="11" text-anchor="middle" fill="#1F2937">POST /api/auth/refresh</text>
<text x="180.0" y="673" font-size="11" text-anchor="middle" fill="#1F2937">{refreshToken} (one shared</text>
<text x="180.0" y="687" font-size="11" text-anchor="middle" fill="#1F2937">refresh per tab; fetch</text>
<text x="180.0" y="701" font-size="11" text-anchor="middle" fill="#1F2937">wrapper + axios</text>
<text x="180.0" y="715" font-size="11" text-anchor="middle" fill="#1F2937">interceptor)</text>
<line x1="105.0" y1="724" x2="253.0" y2="724" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="749" font-size="11" text-anchor="middle" fill="#1F2937">token live and not revoked? revoke old jti (rotated), issue</text>
<text x="405.0" y="763" font-size="11" text-anchor="middle" fill="#1F2937">new pair in the same family</text>
<line x1="255.0" y1="772" x2="553.0" y2="772" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="35" y="787" width="590" height="57" rx="4" fill="#FFF8E1" stroke="#E0B23A"/>
<text x="48" y="803" font-size="11" text-anchor="start" fill="#1F2937">A rotated refresh token presented again after the grace window is treated as theft: the whole family is revoked, the</text>
<text x="48" y="818" font-size="11" text-anchor="start" fill="#1F2937">event is audited and recorded in login_history. Password change / reset, deactivation and role changes raise</text>
<text x="48" y="833" font-size="11" text-anchor="start" fill="#1F2937">token_version (and revoke refresh tokens), ending every session.</text>
<text x="180.0" y="860" font-size="11" text-anchor="middle" fill="#5B6776">new access + refresh</text>
<text x="180.0" y="874" font-size="11" text-anchor="middle" fill="#5B6776">token; SPA retries the</text>
<text x="180.0" y="888" font-size="11" text-anchor="middle" fill="#5B6776">original request</text>
<line x1="255.0" y1="897" x2="107.0" y2="897" stroke="#5B6776" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="30" y1="926" x2="630" y2="926" stroke="#00ACF1" stroke-width="1"/>
<rect x="296.640625" y="915" width="66.71875" height="22" rx="10" fill="white" stroke="#00ACF1"/>
<text x="330.0" y="930" font-size="11.5" text-anchor="middle" fill="#0065B3" font-weight="bold">Sign-out</text>
<text x="180.0" y="956" font-size="11" text-anchor="middle" fill="#1F2937">POST /api/auth/logout</text>
<text x="180.0" y="970" font-size="11" text-anchor="middle" fill="#1F2937">{refreshToken}</text>
<line x1="105.0" y1="979" x2="253.0" y2="979" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="405.0" y="1004" font-size="11" text-anchor="middle" fill="#1F2937">revoke refresh token (reason logout)</text>
<line x1="255.0" y1="1013" x2="553.0" y2="1013" stroke="#1F2937" stroke-width="1.2" marker-end="url(#ah)"/>
</svg>
