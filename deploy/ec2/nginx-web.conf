# BrokerVerse front end on the EC2 host (FRONTEND_TARGET=ec2 in the deploy workflow). Installed by
# deploy/ec2/release.sh as /etc/nginx/conf.d/brokerverse-web.conf with __WEB_ROOT__ and __SERVER_NAME__ filled in.
# The snippets in /etc/nginx/brokerverse are written by brokerverse/scripts/nginx-snippets.sh at each deployment:
# headers.conf (security headers, Content-Security-Policy) and api-proxy.conf (/api/ to the API on this host), so
# the browser reaches the API on the same origin and the build needs no API address.
# TLS: terminate on the load balancer / CloudFront in front of this server, or add certbot to this server block.
server {
  listen 80;
  server_name __SERVER_NAME__;
  root __WEB_ROOT__;
  client_max_body_size 25m;
  server_tokens off;

  include /etc/nginx/brokerverse/api-proxy.conf;

  # content-hashed bundles: cached for a year
  location /static/ {
    include /etc/nginx/brokerverse/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # environment settings and the page that loads the bundles: never served from a cache
  location = /env-config.js {
    include /etc/nginx/brokerverse/headers.conf;
    add_header Cache-Control "no-store, max-age=0" always;
  }
  location = /index.html {
    include /etc/nginx/brokerverse/headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # single-page app fallback
  location / {
    include /etc/nginx/brokerverse/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
