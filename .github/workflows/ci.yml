name: CI

# Tests every push and pull request: the backend against a real PostgreSQL, the front end's tests and production build,
# and the backend container image.

on:
  push:
    branches: [brokerverse-platform, main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brokerverse_test
          POSTGRES_USER: brokerverse
          POSTGRES_PASSWORD: brokerverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brokerverse -d brokerverse_test"
          --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint src test scripts
      - run: npx vitest run
        env:
          TEST_DATABASE_URL: postgres://brokerverse:brokerverse@127.0.0.1:5432/brokerverse_test

  frontend:
    name: Front-end tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brokerverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brokerverse/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx craco test --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_BASE_URL: /api

  image:
    name: Backend image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t brokerverse-api:${{ github.sha }} backend
