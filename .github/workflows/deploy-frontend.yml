name: CI/CD Pipeline

# Push to main. Order: build, then deploy.
# Lint and tests are commented out for now so a failing check does not block deploy.
# Front end goes to S3. API is reloaded with PM2 on EC2 (deploy/ec2/deploy.sh).
# brokerverse/.github/workflows/deploy.yml is the front-end publish used when that folder is its own repository.
#
# Front end: https://brokerverse-demo.inxtuniverse.com
# API:       https://brokerverse-demo-api.inxtuniverse.com
# Repository variable REACT_APP_BASE_URL overrides the API address baked into the build.
# On the EC2 host, backend/.env must set:
#   CORS_ORIGINS=https://brokerverse-demo.inxtuniverse.com
#   PUBLIC_BASE_URL=https://brokerverse-demo-api.inxtuniverse.com
# Repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   S3_BUCKET
#   CLOUDFRONT_DISTRIBUTION_ID
#   EC2_HOST
#   EC2_USER                        e.g. ubuntu
#   EC2_SSH_KEY                     private key that can ssh to the instance
# The API environment stays on the instance at /home/ubuntu/appdata/brokerverse/backend/.env.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  AWS_REGION: ap-southeast-1

jobs:
