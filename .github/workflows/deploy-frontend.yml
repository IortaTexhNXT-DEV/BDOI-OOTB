name: Deploy front end

# Builds the BrokerVerse front end (brokerverse/) and publishes brokerverse/build/ to the S3 bucket behind the
# CloudFront distribution of the BrokerVerse URL. Use this workflow when this repository is connected as it is
# (front end in the brokerverse/ folder). Runs on a push to the deploy branch or by hand (Actions > Run workflow).
#
# Repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
# Repository variables: REACT_APP_BASE_URL (the API address, e.g. https://<brokerverse-url>/api)
#                       DEPLOY_BRANCH is fixed below; change it if your deploy branch is not "dev"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brokerverse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: brokerverse/package-lock.json

      - name: Check the API address is set
        run: |
          if [ -z "${{ vars.REACT_APP_BASE_URL }}" ]; then
            echo "The repository variable REACT_APP_BASE_URL is not set; the app would have no API address." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npx craco test --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}

      - name: Check the build output
        run: |
          # an unbuilt index.html still holds %PUBLIC_URL% and loads no script: never publish it
          if grep -q "%PUBLIC_URL%" build/index.html || ! grep -q "/static/js/" build/index.html; then
            echo "build/index.html is not a production build; nothing is published." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # hashed assets can be cached for a year; index.html must always be fetched fresh
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp build/index.html s3://${{ secrets.S3_BUCKET }}/index.html --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
